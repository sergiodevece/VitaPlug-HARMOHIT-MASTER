name: HARMOHIT MASTER R2 — Windows x64 distribution
on:
  workflow_dispatch:
  push:
    branches: [distribution/windows-vst3-r2]
permissions:
  contents: read
concurrency:
  group: master-r2-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-r2:
    if: github.ref == 'refs/heads/distribution/windows-vst3-r2'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm frozen R2 product and pinned JUCE
        shell: pwsh
        run: |
          git diff --exit-code f2e88eef2a28bcca1d547ad207af8f9da33f418b HEAD -- Source Resources
          if ($LASTEXITCODE -ne 0) { throw 'Frozen product changed' }
          git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git external/JUCE
          if ($LASTEXITCODE -ne 0) { throw 'JUCE checkout failed' }
          if ((git -C external/JUCE rev-parse HEAD).Trim() -ne 'be29c81492b6151c8ea8d14c840e1311963b3a83') { throw 'JUCE pin mismatch' }
          New-Item -ItemType Directory -Path validation -Force | Out-Null
      - name: Configure genuine VS2022 Release x64, public suites only
        shell: pwsh
        run: |
          cmake -S . -B build/windows-x64 -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/external/JUCE" -DDRIVE670_LAB_DIR="${{ github.workspace }}/private-reference-not-supplied" 2>&1 | Tee-Object validation/configure.txt
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          'Public suites: HarmoHitMasterTests, HarmoHitDriveTests, HarmoHitPublic670Tests, HarmoHitVST3Smoke. Private suites NOT run: HarmoHitDrive670IntegrationTests, Drive670CoreIsVerbatim, Drive670PostGainIsVerbatim (LAB/WAV private, remain available locally).' | Set-Content validation/test-scope.txt
      - name: Build unchanged MASTER VST3 and public validation targets
        shell: pwsh
        run: |
          cmake --build build/windows-x64 --config Release --parallel 2 --target VitaPlugHarmoHitMasterR1_VST3 HarmoHitMasterTests HarmoHitDriveTests HarmoHitPublic670Tests HarmoHitVST3Smoke 2>&1 | Tee-Object validation/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build failed; no product-source workaround is authorised' }
      - name: CTest including actual VST3 Windows host smoke
        shell: pwsh
        run: |
          ctest --test-dir build/windows-x64 -C Release --output-on-failure -V 2>&1 | Tee-Object validation/ctest.txt
          if ($LASTEXITCODE -ne 0) { throw 'Public CTest failed' }
          Copy-Item build/windows-x64/validation-ui.png validation/Windows-VST3-editor.png
          $validator = Get-Command validator.exe -ErrorAction SilentlyContinue
          if ($validator) {
            & $validator.Source 'build/windows-x64/VitaPlugHarmoHitMasterR1_artefacts/Release/VST3/VitaPlug HARMOHIT MASTER.vst3' 2>&1 | Tee-Object validation/steinberg-validator.txt
            if ($LASTEXITCODE -ne 0) { throw 'Installed VST3 validator failed' }
          } else {
            'Steinberg validator not installed on this runner; JUCE bundled SDK has no validator executable/sample. Actual JUCE VST3 host smoke passed, not an official validator certification.' | Set-Content validation/steinberg-validator.txt
          }
      - name: Inspect PE x64, embedded graphics and package for Miguelo
        shell: pwsh
        run: ./Distribution/windows/Package-Miguelo.ps1 -Workspace $env:GITHUB_WORKSPACE -Revision $env:GITHUB_SHA
      - name: Upload collaborator ZIP (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: HARMOHIT-MASTER-R2-Windows-x64-Miguelo
          path: |
            ${{ env.MIGUELO_ZIP }}
            ${{ env.MIGUELO_ZIP_SHA }}
          if-no-files-found: error
          retention-days: 30
      - name: Preserve diagnostic evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HARMOHIT-MASTER-R2-Windows-validation
          path: |
            validation/
            build/windows-x64/Testing/Temporary/
            build/windows-x64/validation-ui*.png
          if-no-files-found: warn
          retention-days: 30
